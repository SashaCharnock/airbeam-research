<style>

<body>
<div id="root"></div>
<script>
window.addEventListener('load', function() {
  try {
  if (!window.React || !window.ReactDOM) {
    document.getElementById('root').innerHTML = '<div style="color:#ef4444;padding:40px;font-family:monospace;">React failed to load. Check internet connection and refresh.</div>';
    return;
  }
  var R=window.React, RD=window.ReactDOM, XL=window.XLSX;
  var e=R.createElement;
  var useState=R.useState, useMemo=R.useMemo, useRef=R.useRef, useEffect=R.useEffect;

  var CORRECT_PIN="airbeam2026";
  var CATEGORY_META={
    "Bus Stops":          {hex:"#FFC000",text:"#5a3e00",icon:"🚏",ivLabels:["Distance from road","Position vs. Shelter","Traffic","Highway?"],locationHint:"City, Bus Stop",notesHint:"Traffic, Wind, Events..."},
    "Riding Bus":         {hex:"#92D050",text:"#2a4a00",icon:"🚌",ivLabels:["# of people","Position","Windows"],locationHint:"City / Route",notesHint:"Door openings, Events..."},
    "Transit Comparison": {hex:"#FF7D7D",text:"#5a0000",icon:"🚆",ivLabels:["# of people","Position"],locationHint:"Vancouver",notesHint:"Above/Underground, Airflow..."},
    "City Comparison":    {hex:"#00B0F0",text:"#003a50",icon:"🌆",ivLabels:["Crowding","Traffic","Wind","Weather"],locationHint:"City, Area",notesHint:"Events, Peaks..."},
    "Dental":             {hex:"#FF99FF",text:"#5a005a",icon:"🦷",ivLabels:["Size of Dog","Tartar","# Extractions","Mask on/off"],locationHint:"Monitor location",notesHint:"Additional procedures..."},
    "Events":             {hex:"#CC99FF",text:"#330066",icon:"🎪",ivLabels:["Crowding","Proximity"],locationHint:"City, Location",notesHint:"Dust, Wind, Smoking..."},
    "Cooking":            {hex:"#FFFF66",text:"#4a4a00",icon:"🍳",ivLabels:["Appliance type","Windows"],locationHint:"Indoor/Outdoor",notesHint:"What was cooked, peaks..."},
    "Campfire":           {hex:"#F6CA7A",text:"#5a3200",icon:"🔥",ivLabels:["Distance from Fire","Cooking?"],locationHint:"Area",notesHint:"Wood amount, wind, stage..."},
    "Households":         {hex:"#99FFCC",text:"#005a30",icon:"🏠",ivLabels:["# of residents","Fireplace/Pets"],locationHint:"City",notesHint:"Windows, air purifier..."},
    "Wildfire":           {hex:"#E06060",text:"#3a0000",icon:"🌫️",ivLabels:["Windows","Air Purifier"],locationHint:"City, Indoor/Outdoor",notesHint:"Time to baseline, proximity..."},
    "Masks and Wildfire": {hex:"#93E3FF",text:"#002a3a",icon:"😷",ivLabels:["Mask vs No Mask","Prototype"],locationHint:"City, Indoor/Outdoor",notesHint:"Prototype details..."},
    "City Monitors":      {hex:"#B0C4DE",text:"#1a2a3a",icon:"📡",ivLabels:["Distance from Monitor"],locationHint:"City, Monitor Location",notesHint:"Wind, Dust, Traffic..."},
    "For Fun":            {hex:"#FF99CC",text:"#5a0030",icon:"✨",ivLabels:["Crowding"],locationHint:"Location",notesHint:"Anything interesting..."}
  };
  var ALL_CATS=Object.keys(CATEGORY_META);
  var PM_BANDS={
    pm25:{thresholds:[12,35,55,150],label:"PM2.5 µg/m³",unit:"µg/m³"},
    pm10:{thresholds:[20,50,100,200],label:"PM10 µg/m³",unit:"µg/m³"},
    pm1: {thresholds:[9,35,55,150],label:"PM1 µg/m³",unit:"µg/m³"},
    rh:  {thresholds:[25,50,75,90],label:"Humidity %",unit:"%"},
    temp:{thresholds:[10,20,30,40],label:"Temp °C",unit:"°C"}
  };
  var BAND_COLORS=["#00c896","#f5c518","#f97316","#e63946","#c026d3"];
  var BAND_LABELS=["Good","Moderate","Sensitive","Unhealthy","Very Unhealthy"];

  function getInitials(name){
    var parts=(name||'').trim().split(/\s+/);
    return parts.length>=2?(parts[0][0]+parts[parts.length-1][0]).toUpperCase():(name||'').slice(0,2).toUpperCase();
  }
  function nameColor(name){
    var h=(name||'').split('').reduce(function(a,c){return((a<<5)-a)+c.charCodeAt(0)|0;},0);
    return 'hsl('+(Math.abs(h)%360)+',60%,52%)';
  }

  function getBandColor(v,metric){
    var b=PM_BANDS[metric];if(!b||v==null)return"#94a3b8";
    for(var i=0;i<b.thresholds.length;i++)if(v<=b.thresholds[i])return BAND_COLORS[i];
    return BAND_COLORS[4];
  }
  function categorize(name){
    var n=(name||"").toLowerCase();
    if(n.includes("bus_stop")||n.includes("bus stop")||n.includes("bus stops"))return"Bus Stops";
    if(n.includes("riding")||n.includes("bus interior")||n.includes("riding_bus"))return"Riding Bus";
    if(n.includes("transit"))return"Transit Comparison";
    if(n.includes("city_comparison")||n.includes("city comparison"))return"City Comparison";
    if(n.includes("dental")||n.includes("vet"))return"Dental";
    if(n.includes("nail"))return"Nails";
    if(n.includes("event")||n.includes("highland")||n.includes("festival"))return"Events";
    if(n.includes("cook"))return"Cooking";
    if(n.includes("campfire"))return"Campfire";
    if(n.includes("household"))return"Households";
    if(n.includes("mask"))return"Masks and Wildfire";
    if(n.includes("wildfire")||n.includes("smoke"))return"Wildfire";
    if(n.includes("monitor"))return"City Monitors";
    return"For Fun";
  }
  function avgArr(arr){return arr.length?parseFloat((arr.reduce(function(a,b){return a+b;},0)/arr.length).toFixed(2)):null;}

  function parseFile(buf){
    if(!XL){alert("XLSX library not loaded.");return[];}
    var wb=XL.read(buf,{type:"array",cellDates:true});
    var sessions=[],gid=Date.now();
    wb.SheetNames.forEach(function(sn){
      var ws=wb.Sheets[sn];
      var rows=XL.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:"yyyy-mm-dd hh:mm:ss"});
      if(rows.length<2)return;
      var hdr=rows[0].map(function(h){return String(h||"").trim();});
      var ti=hdr.findIndex(function(h){return h==="Timestamp";}),
          p1i=hdr.findIndex(function(h){return h.startsWith("PM1");}),
          p25i=hdr.findIndex(function(h){return h.startsWith("PM2.5");}),
          p10i=hdr.findIndex(function(h){return h.startsWith("PM10");}),
          rhi=hdr.findIndex(function(h){return h.includes("Humidity");}),
          tmi=hdr.findIndex(function(h){return h.startsWith("Temp");}),
          ni=hdr.findIndex(function(h){return h==="Note";}),
          nmi=hdr.findIndex(function(h){return h==="Session Name";}),
          lati=hdr.findIndex(function(h){return h.toLowerCase().includes("latitude");}),
          loni=hdr.findIndex(function(h){return h.toLowerCase().includes("longitude");});
      if(ti===-1||p25i===-1)return;
      var dr=rows.slice(1).map(function(r){
        return{ts:r[ti],pm1:parseFloat(r[p1i]),pm25:parseFloat(r[p25i]),
          pm10:parseFloat(r[p10i]),rh:parseFloat(r[rhi]),temp:parseFloat(((parseFloat(r[tmi])-32)*5/9).toFixed(2)),
          note:ni>=0?r[ni]:null,name:nmi>=0?r[nmi]:sn,
          lat:lati>=0?parseFloat(r[lati]):NaN,lon:loni>=0?parseFloat(r[loni]):NaN};
      }).filter(function(r){return r.ts&&!isNaN(r.pm25);});
      if(!dr.length)return;
      var bk={};
      dr.forEach(function(r){
        var d=new Date(r.ts);if(isNaN(d.getTime()))return;
        var b=Math.floor(d.getTime()/5000)*5000;
        if(!bk[b])bk[b]={pm1:[],pm25:[],pm10:[],rh:[],temp:[],notes:[],lats:[],lons:[]};
        if(!isNaN(r.pm1))bk[b].pm1.push(r.pm1);
        if(!isNaN(r.pm25))bk[b].pm25.push(r.pm25);
        if(!isNaN(r.pm10))bk[b].pm10.push(r.pm10);
        if(!isNaN(r.rh))bk[b].rh.push(r.rh);
        if(!isNaN(r.temp))bk[b].temp.push(r.temp);
        if(r.note&&String(r.note).trim())bk[b].notes.push(String(r.note).trim());
        if(!isNaN(r.lat)&&r.lat!==0)bk[b].lats.push(r.lat);
        if(!isNaN(r.lon)&&r.lon!==0)bk[b].lons.push(r.lon);
      });
      var ts=Object.entries(bk).sort(function(a,b){return+a[0]-+b[0];}).map(function(entry){
        var ms=entry[0],v=entry[1];
        return{t:new Date(+ms).toTimeString().slice(0,8),
          pm1:avgArr(v.pm1),pm25:avgArr(v.pm25),pm10:avgArr(v.pm10),
          rh:avgArr(v.rh),temp:avgArr(v.temp),note:v.notes[0]||null,
          lat:v.lats.length?v.lats[0]:null,lon:v.lons.length?v.lons[0]:null};
      });
      var nm=ts.filter(function(t){return t.note;}).map(function(t){return{t:t.t,note:t.note,pm25:t.pm25};});
      var pm25v=ts.map(function(t){return t.pm25;}).filter(Boolean);
      var sname=dr[0].name||sn,sd=new Date(dr[0].ts);
      sessions.push({id:gid++,sheet:sn,category:categorize(sname),name:sname,
        date:isNaN(sd.getTime())?"":sd.toISOString().slice(0,10),
        time:isNaN(sd.getTime())?"":sd.toTimeString().slice(0,5),
        trial:"",location:"",iv1:"",iv2:"",iv3:"",iv4:"",
        pm1:avgArr(ts.map(function(t){return t.pm1;}).filter(Boolean)),
        pm25:avgArr(pm25v),
        pm10:avgArr(ts.map(function(t){return t.pm10;}).filter(Boolean)),
        temp:avgArr(ts.map(function(t){return t.temp;}).filter(Boolean)),
        humidity:avgArr(ts.map(function(t){return t.rh;}).filter(Boolean)),
        notes:"",notePhotos:[],timeSeries:ts,noteMarkers:nm,
        gpsPath:ts.filter(function(t){return t.lat&&t.lon;}).map(function(t){return{lat:t.lat,lon:t.lon,pm25:t.pm25,t:t.t};}),
        maxPm25:pm25v.length?parseFloat(Math.max.apply(null,pm25v).toFixed(2)):null});
    });
    return sessions;
  }

  // ── AirBeam CSV parser ────────────────────────────────────────────────────
  function parseCsvAirBeam(text) {
    var lines = text.split(/\r?\n/);
    // Find the data header row (first column is "ObjectID")
    var headerIdx = -1;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].startsWith('ObjectID')) { headerIdx = i; break; }
    }
    if (headerIdx === -1) return [];

    // Find the sensor names row — first row where col 5 matches AirBeam3-xxx (dash, not colon)
    var sensorCols = [];
    for (var i = 0; i < headerIdx; i++) {
      var p = lines[i].split(',');
      if (p.length > 5 && p[5] && /^AirBeam\d+-/.test(p[5].trim())) {
        sensorCols = p.slice(5).map(function(s){ return s.trim(); }).filter(Boolean);
        break;
      }
    }

    var headers = lines[headerIdx].split(',').map(function(h){ return h.trim(); });

    // Map sensor name → column label ("N:Measurement_Value")
    function sensorColName(name) {
      var idx = sensorCols.indexOf(name);
      return idx === -1 ? null : (idx + 1) + ':Measurement_Value';
    }
    function hdrIdx(col) { return col ? headers.indexOf(col) : -1; }

    var tsi   = headers.indexOf('Timestamp');
    var lati  = headers.indexOf('Latitude');
    var loni  = headers.indexOf('Longitude');
    var nmi   = headers.indexOf('Session_Name');
    var pm25I = hdrIdx(sensorColName(sensorCols.find(function(s){ return s.endsWith('-PM2.5'); })));
    var pm1I  = hdrIdx(sensorColName(sensorCols.find(function(s){ return /^AirBeam\d+-PM1$/.test(s); })));
    var pm10I = hdrIdx(sensorColName(sensorCols.find(function(s){ return s.endsWith('-PM10'); })));
    var tempI = hdrIdx(sensorColName(sensorCols.find(function(s){ return s.endsWith('-F'); })));
    var rhI   = hdrIdx(sensorColName(sensorCols.find(function(s){ return s.endsWith('-RH'); })));

    if (tsi === -1 || pm25I === -1) return [];

    // Group rows by session name
    var sessions = {};
    for (var i = headerIdx + 1; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var c = line.split(',');
      var ts = c[tsi] ? c[tsi].trim() : '';
      var pm25 = parseFloat(c[pm25I]);
      if (!ts || isNaN(pm25)) continue;
      var sname = (nmi >= 0 && c[nmi] ? c[nmi].trim() : '') || 'Session';
      if (!sessions[sname]) sessions[sname] = [];
      sessions[sname].push({
        ts: ts,
        lat:  lati  >= 0 ? parseFloat(c[lati])  : NaN,
        lon:  loni  >= 0 ? parseFloat(c[loni])  : NaN,
        pm1:  pm1I  >= 0 ? parseFloat(c[pm1I])  : NaN,
        pm25: pm25,
        pm10: pm10I >= 0 ? parseFloat(c[pm10I]) : NaN,
        temp: tempI >= 0 ? parseFloat(((parseFloat(c[tempI]) - 32) * 5 / 9).toFixed(2)) : NaN,
        rh:   rhI   >= 0 ? parseFloat(c[rhI])   : NaN
      });
    }

    // Build session objects in the same format as the xlsx parser
    var result = [];
    var gid = 0;
    Object.keys(sessions).forEach(function(sname) {
      var dr = sessions[sname].filter(function(r){ return !isNaN(r.pm25); });
      if (!dr.length) return;
      var bk = {};
      dr.forEach(function(r) {
        var d = new Date(r.ts);
        if (isNaN(d.getTime())) return;
        var b = Math.floor(d.getTime() / 5000) * 5000;
        if (!bk[b]) bk[b] = {pm1:[],pm25:[],pm10:[],rh:[],temp:[],lats:[],lons:[]};
        if (!isNaN(r.pm1))  bk[b].pm1.push(r.pm1);
        if (!isNaN(r.pm25)) bk[b].pm25.push(r.pm25);
        if (!isNaN(r.pm10)) bk[b].pm10.push(r.pm10);
        if (!isNaN(r.rh))   bk[b].rh.push(r.rh);
        if (!isNaN(r.temp)) bk[b].temp.push(r.temp);
        if (!isNaN(r.lat) && r.lat !== 0) bk[b].lats.push(r.lat);
        if (!isNaN(r.lon) && r.lon !== 0) bk[b].lons.push(r.lon);
      });
      var ts = Object.entries(bk).sort(function(a,b){ return +a[0]-+b[0]; }).map(function(entry){
        var ms=entry[0], v=entry[1];
        return {t:new Date(+ms).toTimeString().slice(0,8),
          pm1:avgArr(v.pm1), pm25:avgArr(v.pm25), pm10:avgArr(v.pm10),
          rh:avgArr(v.rh), temp:avgArr(v.temp), note:null,
          lat:v.lats.length?v.lats[0]:null, lon:v.lons.length?v.lons[0]:null};
      });
      var pm25v = ts.map(function(t){ return t.pm25; }).filter(Boolean);
      var sd = new Date(dr[0].ts);
      result.push({
        id:gid++, sheet:sname, category:categorize(sname), name:sname,
        date:isNaN(sd.getTime())?'':sd.toISOString().slice(0,10),
        time:isNaN(sd.getTime())?'':sd.toTimeString().slice(0,5),
        trial:'', location:'', iv1:'', iv2:'', iv3:'', iv4:'',
        pm1:avgArr(ts.map(function(t){return t.pm1;}).filter(Boolean)),
        pm25:avgArr(pm25v),
        pm10:avgArr(ts.map(function(t){return t.pm10;}).filter(Boolean)),
        temp:avgArr(ts.map(function(t){return t.temp;}).filter(Boolean)),
        humidity:avgArr(ts.map(function(t){return t.rh;}).filter(Boolean)),
        notes:'', notePhotos:[], timeSeries:ts, noteMarkers:[],
        gpsPath:ts.filter(function(t){return t.lat&&t.lon;}).map(function(t){return {lat:t.lat,lon:t.lon,pm25:t.pm25,t:t.t};}),
        maxPm25:pm25v.length?parseFloat(Math.max.apply(null,pm25v).toFixed(2)):null
      });
    });
    return result;
  }

    // ── GPS Map ──────────────────────────────────────────────────────────────
  var GPS_LEGEND=[['#00c896','≤12'],['#f5c518','≤35'],['#f97316','≤55'],['#e63946','≤150'],['#c026d3','>150']];
  function gpsAtTime(t,gpsPath){
    if(!gpsPath||!gpsPath.length)return null;
    function secs(s){var p=s.split(':');return +p[0]*3600 + +p[1]*60 + (+p[2]||0);}
    var nt=secs(t);
    return gpsPath.reduce(function(best,p){var d=Math.abs(secs(p.t)-nt);return d<best.d?{p:p,d:d}:best;},{p:gpsPath[0],d:Infinity}).p;
  }
  function buildLeafletMap(container,gpsPath,opts){
    var L=window.L;if(!L)return null;
    var pts=gpsPath.filter(function(p){return p.lat&&p.lon;});
    if(!pts.length)return null;
    var map=L.map(container,Object.assign({zoomControl:true,scrollWheelZoom:true,dragging:true,touchZoom:true,doubleClickZoom:true},opts||{}));
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
    for(var i=0;i<pts.length-1;i++){
      var pm=pts[i].pm25||0;
      var sc=pm<=12?'#00c896':pm<=35?'#f5c518':pm<=55?'#f97316':pm<=150?'#e63946':'#c026d3';
      L.polyline([[pts[i].lat,pts[i].lon],[pts[i+1].lat,pts[i+1].lon]],{color:sc,weight:4,opacity:0.85}).addTo(map);
    }
    L.circleMarker([pts[0].lat,pts[0].lon],{radius:6,color:'#fff',fillColor:'#22c55e',fillOpacity:1,weight:2}).bindPopup('Start').addTo(map);
    L.circleMarker([pts[pts.length-1].lat,pts[pts.length-1].lon],{radius:6,color:'#fff',fillColor:'#ef4444',fillOpacity:1,weight:2}).bindPopup('End').addTo(map);
    map.fitBounds(pts.map(function(p){return[p.lat,p.lon];}),{padding:[16,16]});
    return map;
  }

  function MapModal(props){
    var ref=useRef(null);
    var mapRef=useRef(null);
    var sn=useState(null),selNote=sn[0],setSelNote=sn[1];
    var et=useState(""),editText=et[0],setEditText=et[1];
    useEffect(function(){
      if(!ref.current)return;
      if(mapRef.current){try{mapRef.current.remove();}catch(e){}mapRef.current=null;}
      var map=buildLeafletMap(ref.current,props.gpsPath,{});
      mapRef.current=map;
      if(map&&props.noteMarkers&&props.noteMarkers.length){
        var L=window.L;
        var icon=L.divIcon({html:'<div style="width:22px;height:22px;background:#1e3a5f;border:2px solid #60a5fa;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;line-height:1">📝</div>',iconSize:[22,22],iconAnchor:[11,11],className:''});
        props.noteMarkers.forEach(function(n){
          var pt=gpsAtTime(n.t,props.gpsPath);
          if(!pt)return;
          L.marker([pt.lat,pt.lon],{icon:icon})
            .on('click',function(){setSelNote(n);setEditText(n.note||'');})
            .addTo(map);
        });
      }
      return function(){if(mapRef.current){try{mapRef.current.remove();}catch(e){}mapRef.current=null;}};
    },[props.gpsPath,props.noteMarkers]);
    function saveNote(){
      if(!selNote)return;
      var updated=(props.noteMarkers||[]).map(function(n){return n.t===selNote.t?Object.assign({},n,{note:editText}):n;});
      if(props.onUpdateNotes)props.onUpdateNotes(props.sessionId,updated);
      setSelNote(null);
    }
    var tinp={background:"#1e293b",border:"1px solid #334155",borderRadius:8,padding:"8px 10px",color:"#e2e8f0",fontSize:13,width:"100%",boxSizing:"border-box",resize:"vertical",fontFamily:"'DM Sans',sans-serif"};
    return e('div',{style:{position:"fixed",inset:0,background:"#000c",zIndex:1001,display:"flex",alignItems:"center",justifyContent:"center",padding:16},onClick:function(ev){if(ev.target===ev.currentTarget)props.onClose();}},
      e('div',{style:{background:"#0f172a",borderRadius:16,width:"100%",maxWidth:760,border:"1px solid #334155",overflow:"hidden",display:"flex",flexDirection:"column",maxHeight:"90vh"}},
        e('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderBottom:"1px solid #1e293b",flexWrap:"wrap",gap:8}},
          e('div',{style:{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}},
            e('span',{style:{fontFamily:"monospace",fontSize:12,color:"#94a3b8",fontWeight:700}},"GPS TRACK"),
            GPS_LEGEND.map(function(p,i){return e('div',{key:i,style:{display:"flex",alignItems:"center",gap:3,fontSize:10,fontFamily:"monospace",color:"#94a3b8"}},
              e('div',{style:{width:18,height:4,borderRadius:2,background:p[0]}}),p[1]);}),
            props.noteMarkers&&props.noteMarkers.length?e('div',{style:{display:"flex",alignItems:"center",gap:4,fontSize:10,fontFamily:"monospace",color:"#60a5fa"}},"📝 "+props.noteMarkers.length+" note"+(props.noteMarkers.length!==1?"s":"")):null
          ),
          e('button',{onClick:props.onClose,style:{background:"none",border:"none",color:"#64748b",fontSize:22,lineHeight:1,cursor:"pointer",flexShrink:0}},"✕")
        ),
        e('div',{ref:ref,style:{flex:1,minHeight:320}}),
        selNote?e('div',{style:{borderTop:"1px solid #1e293b",padding:"12px 16px",background:"#0a0f1a",flexShrink:0}},

        onEdit:function(s){setModal({category:s.category,session:s,sessionList:filtered.filter(function(x){return x.category===s.category;}).sort(function(a,b){return (a.trial||0)-(b.trial||0);})});},
        onDelete:function(id,cb){
          fetch('/api/sessions/'+id,{method:'DELETE',headers:{'X-User-Pin':userPin}})
            .then(function(r){
              if(!r.ok){showToast('Delete failed — permission denied',false);return;}
              setSessions(function(ss){return ss.filter(function(s){return s.id!==id;});});
              if(cb)cb();
            })
            .catch(function(){showToast('Delete failed',false);});
        },
        onUpdatePhotos:handleUpdatePhotos,
        onUpdateNotes:handleUpdateNotes,
        onUpdateQA:handleUpdateQA,
        onQaSeen:onQaSeen,
        seenIds:seenIds,
        onClose:function(){setCatModal(null);}
      }):null,
      modal?e(Modal,{category:modal.category,session:modal.session,sessionList:modal.sessionList,pin:userPin,onNavigate:function(s){setModal({category:s.category,session:s,sessionList:modal.sessionList});},onSave:handleSave,onClose:function(){setModal(null);}}):null,
      showUserMgmt?e(UserManageModal,{onClose:function(){setShowUserMgmt(false);}}):null,
      showNewCat?e(NewCategoryModal,{
        onSave:function(cat){
          if(!CATEGORY_META[cat.name]){
            CATEGORY_META[cat.name]={hex:cat.hex,text:cat.text,icon:cat.icon,ivLabels:cat.ivLabels||[],locationHint:"Location",notesHint:"Notes..."};
            setAllCats(function(ac){return ac.concat([cat.name]);});
            fetch('/api/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:cat.name,hex:cat.hex,text:cat.text,icon:cat.icon,ivLabels:cat.ivLabels||[]})}).catch(function(){});
          }
          setShowNewCat(false);
        },
        onClose:function(){setShowNewCat(false);}
      }):null,
      showFilter?e(FilterModal,{
        allCats:allCats,
        sessions:sessions,
        filters:filters,
        onApply:function(f){setFilters(f);setShowFilter(false);},
        onClose:function(){setShowFilter(false);}
      }):null
    );
  }

  // ── Quick Tag Groups ──────────────────────────────────────────────────────
  var TAG_GROUPS = [
    {label:"Windows",     tags:["Windows Open","Windows Closed","1 Window Open","2+ Windows Open"]},
    {label:"Location",    tags:["Indoors","Outdoors"]},
    {label:"Crowding",    tags:["Low (0-25 people)","Moderate (25-50 people)","High (50+ people)"]},
    {label:"Traffic",     tags:["Low (0-10 cars)","Moderate (10-20 cars)","High (20+ cars)"]},
    {label:"Wind",        tags:["Calm (0-5 km/h)","Light (5-15 km/h)","Moderate (15-30 km/h)","Strong (30+ km/h)"]},
    {label:"Weather",     tags:["Sunny","Cloudy","Overcast","Raining","Foggy"]},
    {label:"A/C & Heat",  tags:["A/C On","A/C Off","Heat On","Heat Off","HVAC On","HVAC Off"]},
    {label:"Air Purifier",tags:["Air Purifier On","Air Purifier Off"]},
    {label:"Mask",        tags:["Mask On","Mask Off","N95","Surgical Mask","Cloth Mask"]},
    {label:"Door",        tags:["Door Open","Door Closed","Door Opened Briefly"]},
    {label:"Cooking",     tags:["Gas Stove","Electric Stove","Oven","BBQ","Frying","Boiling","No Cooking"]},
    {label:"Fireplace",   tags:["Fireplace On","Fireplace Off","Wood Stove On","Wood Stove Off"]},
    {label:"Smoking",     tags:["Smoking Nearby","No Smoking"]},
    {label:"Shelter",     tags:["In Shelter","Not in Shelter","Shelter w/ Screen","Shelter No Screen"]},
    {label:"Vehicle",     tags:["Bus Doors Open","Bus Doors Closed","Near Exhaust","Near Engine"]},
  ];

  function QuickTags(props){
    // props.notes (string), props.onChange(newNotes)
    var openGroup = useState(null);
    var activeGroupIdx = openGroup[0], setActiveGroupIdx = openGroup[1];
    var active = useState([]);
    var activeTags = active[0], setActiveTags = active[1];

    function toggleTag(tag){
      var isActive = activeTags.indexOf(tag) >= 0;
      var newActive;
      if(isActive){
        newActive = activeTags.filter(function(t){return t!==tag;});
      } else {
        newActive = activeTags.concat([tag]);
      }
      setActiveTags(newActive);
      // Rebuild notes: strip old tags and re-append active ones
      var base = props.notes;
      // Remove any previously added tags from notes
      TAG_GROUPS.forEach(function(g){
        g.tags.forEach(function(t){
          base = base.replace(", "+t,"").replace(t+", ","").replace(t,"");
        });
      });
      base = base.trim().replace(/,\s*$/,"").replace(/^\s*,/,"").trim();
      var tagStr = newActive.join(", ");
      var combined = base && tagStr ? base+", "+tagStr : base || tagStr;
      props.onChange(combined);
    }

    return e('div',{style:{marginBottom:10}},
      e('div',{style:{fontSize:11,color:"#64748b",fontFamily:"monospace",marginBottom:6}},"QUICK TAGS"),
      e('div',{style:{display:"flex",gap:4,flexWrap:"wrap",marginBottom:6}},
        TAG_GROUPS.map(function(group, gi){
          var isOpen = activeGroupIdx===gi;
          var groupActive = group.tags.some(function(t){return activeTags.indexOf(t)>=0;});
          return e('button',{key:gi,
            onClick:function(){setActiveGroupIdx(isOpen?null:gi);},
            style:{background:groupActive?"#1e40af":isOpen?"#1e293b":"#0f172a",
              border:"1px solid "+(groupActive?"#3b82f6":isOpen?"#475569":"#334155"),
              borderRadius:6,padding:"3px 10px",fontSize:11,
              color:groupActive?"#93c5fd":isOpen?"#94a3b8":"#64748b",
              fontFamily:"monospace",cursor:"pointer",whiteSpace:"nowrap"}},
            group.label+(groupActive?" ✓":"")
          );
        })
      ),
      activeGroupIdx!==null?e('div',{style:{background:"#0f172a",borderRadius:8,padding:"8px 10px",border:"1px solid #334155",display:"flex",gap:6,flexWrap:"wrap"}},
        TAG_GROUPS[activeGroupIdx].tags.map(function(tag){
          var isOn = activeTags.indexOf(tag)>=0;
          return e('button',{key:tag,onClick:function(){toggleTag(tag);},
            style:{background:isOn?"#1d4ed8":"#1e293b",
              border:"1px solid "+(isOn?"#3b82f6":"#334155"),
              borderRadius:20,padding:"4px 12px",fontSize:12,
              color:isOn?"#fff":"#94a3b8",
              fontFamily:"monospace",cursor:"pointer",
              fontWeight:isOn?700:400}},
            tag
          );
        })
      ):null
    );
  }

  // ── IV Quick Tags (per-field tag groups for independent variables) ────────
  var IV_TAG_GROUPS = [
    {label:"Windows",    tags:["Windows Open","Windows Closed","1 Window Open","2+ Windows Open"]},
    {label:"Location",   tags:["Indoors","Outdoors","Underground","Above Ground"]},
    {label:"Crowding",   tags:["Empty","Low (0-25)","Moderate (25-50)","High (50+)"]},
    {label:"Traffic",    tags:["Low (0-10 cars)","Moderate (10-20 cars)","High (20+ cars)"]},
    {label:"Wind",       tags:["Calm (0-5 km/h)","Light (5-15 km/h)","Moderate (15-30 km/h)","Strong (30+ km/h)"]},
    {label:"Weather",    tags:["Sunny","Cloudy","Overcast","Raining","Foggy"]},
    {label:"A/C & Heat", tags:["A/C On","A/C Off","Heat On","Heat Off","HVAC On"]},
    {label:"Air Purifier",tags:["Air Purifier On","Air Purifier Off"]},
    {label:"Mask",       tags:["Mask On","Mask Off","N95","Surgical Mask","Cloth Mask"]},
    {label:"Position",   tags:["Front","Middle","Back","Left","Right","Window Seat","Aisle Seat","Standing"]},
    {label:"Door",       tags:["Door Open","Door Closed","Door Opened Briefly"]},
    {label:"Cooking",    tags:["Gas Stove","Electric Stove","Oven","BBQ","Frying","Boiling","No Cooking"]},
    {label:"Fireplace",  tags:["Fireplace On","Fireplace Off","Wood Stove On","Wood Stove Off"]},
    {label:"Shelter",    tags:["In Shelter","Not in Shelter","Shelter w/ Screen","Shelter No Screen"]},
    {label:"Vehicle",    tags:["Bus Doors Open","Bus Doors Closed","Near Exhaust","Near Engine"]},
    {label:"Size",       tags:["Small","Medium","Large","Extra Large"]},
    {label:"Yes / No",   tags:["Yes","No","N/A"]},
  ];
  // Best-effort default tag list for a given IV label, based on keyword match against the legacy groups.
  function defaultTagsForLabel(label){
    var l=(label||"").toLowerCase();
    var hit=IV_TAG_GROUPS.find(function(g){return l.indexOf(g.label.toLowerCase())!==-1;});
    if(hit)return hit.tags.slice();
    // a few extra keyword fallbacks
    if(l.indexOf('mask')!==-1)return ["Mask On","Mask Off","N95","Surgical Mask","Cloth Mask"];
    if(l.indexOf('window')!==-1)return ["Windows Open","Windows Closed","1 Window Open","2+ Windows Open"];
    if(l.indexOf('distance')!==-1)return ["Close (<1m)","Near (1-3m)","Far (3-10m)","Very Far (10m+)"];
    if(l.indexOf('people')!==-1||l.indexOf('residents')!==-1||l.indexOf('#')!==-1)return ["0","1-2","3-5","6-10","10+"];
    return ["Yes","No","N/A"];
  }
  // In-memory store of custom tags, keyed "category||label" → array of tag strings.
  // Seeded lazily from defaultTagsForLabel, then editable/persisted per category+label.
  var IV_TAGS_STORE={};
  function ivTagsKey(category,label){return category+'||'+label;}
  function getIvTags(category,label){
    var k=ivTagsKey(category,label);
    if(!IV_TAGS_STORE[k])IV_TAGS_STORE[k]=defaultTagsForLabel(label);
    return IV_TAGS_STORE[k];
  }

  function IVQuickTags(props){
    // props.value, props.onChange, props.label, props.category, props.pin
    var category=props.category, label=props.label;
    var k=ivTagsKey(category,label);
    var tv=useState(function(){return getIvTags(category,label);}),tags=tv[0],setTags=tv[1];
    var ev_=useState(false),editMode=ev_[0],setEditMode=ev_[1];
    useEffect(function(){setTags(getIvTags(category,label));setEditMode(false);},[k]);
    function persist(updated){
      IV_TAGS_STORE[k]=updated;
      setTags(updated);
      fetch('/api/categories/'+encodeURIComponent(category)+'/tags/'+encodeURIComponent(label),{
        method:'PUT',
        headers:{'Content-Type':'application/json','X-User-Pin':props.pin||''},
        body:JSON.stringify({tags:updated})
      }).catch(function(){});
    }
    function insertTag(tag){
      var cur=(props.value||'').trim();
      var next=cur?cur+', '+tag:tag;
      props.onChange(next);
    }
    function addTag(){
      var t=window.prompt('New tag for "'+label+'":');
      if(!t||!t.trim())return;
      persist(tags.concat([t.trim()]));
    }
    function renameTag(i,newVal){
      var updated=tags.slice();updated[i]=newVal;persist(updated);
    }
    function deleteTag(i){
      if(!window.confirm('Delete tag "'+tags[i]+'"?'))return;
      persist(tags.filter(function(_,j){return j!==i;}));
    }
    return e('div',{style:{marginBottom:4}},
      e('div',{style:{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}},
        tags.map(function(tag,i){
          if(editMode){
            return e('div',{key:i,style:{display:"flex",alignItems:"center",gap:2}},
              e('input',{value:tag,onChange:function(ev){renameTag(i,ev.target.value);},
                style:{background:"#1e293b",border:"1px solid #334155",borderRadius:10,padding:"2px 8px",fontSize:11,color:"#e2e8f0",fontFamily:"monospace",width:Math.max(50,tag.length*7)}}),
              e('button',{onClick:function(){deleteTag(i);},
                style:{background:"none",border:"none",color:"#ef4444",fontSize:11,cursor:"pointer",padding:"0 2px"}},"✕")
            );
          }
          return e('button',{key:i,onClick:function(){insertTag(tag);},
            style:{background:"#1e293b",border:"1px solid #334155",
              borderRadius:12,padding:"3px 10px",fontSize:11,
              color:"#94a3b8",fontFamily:"monospace",cursor:"pointer"}},
            tag
          );
        }),
        !props.viewOnly?e('button',{onClick:function(){editMode?setEditMode(false):addTag();},
          title:editMode?"Done editing":"Add a new tag",
          style:{background:"none",border:"1px dashed #334155",borderRadius:12,padding:"3px 8px",fontSize:11,color:"#475569",fontFamily:"monospace",cursor:"pointer"}},
          editMode?"Done":"+"):null,
        !props.viewOnly&&!editMode&&tags.length?e('button',{onClick:function(){setEditMode(true);},
          title:"Edit tags",
          style:{background:"none",border:"none",fontSize:11,color:"#475569",cursor:"pointer",padding:"0 2px"}},"✎"):null
      )
    );
  }

  // ── New Category Modal ────────────────────────────────────────────────────
  var PRESET_ICONS=["🔬","🏙️","🌿","🚗","🏫","🏥","🛒","🎯","🌊","🏔️","💨","🔥","📊","🐾"];
  var PRESET_COLORS=[
    {hex:"#FFB347",text:"#5a2d00"},{hex:"#87CEEB",text:"#002a3a"},{hex:"#98FB98",text:"#003a00"},
    {hex:"#DDA0DD",text:"#3a003a"},{hex:"#F0E68C",text:"#4a4a00"},{hex:"#FFA07A",text:"#5a1a00"},
    {hex:"#B0E0E6",text:"#002a30"},{hex:"#FFDAB9",text:"#5a2a00"},{hex:"#E6E6FA",text:"#1a003a"},
    {hex:"#90EE90",text:"#003a00"}
  ];
  function NewCategoryModal(props){
    var nv=useState(""),name=nv[0],setName=nv[1];
    var iv=useState("🔬"),icon=iv[0],setIcon=iv[1];
    var cv=useState(PRESET_COLORS[0]),color=cv[0],setColor=cv[1];
    var err=useState(""),error=err[0],setError=err[1];
    var ilv=useState(["","","",""]),ivLabels=ilv[0],setIvLabels=ilv[1];
    function setIvLabel(i,v){setIvLabels(function(ls){var n=ls.slice();n[i]=v;return n;});}
    function save(){
      var n=name.trim();
      if(!n){setError("Please enter a section name.");return;}
      if(CATEGORY_META[n]){setError("A section with this name already exists.");return;}
      var labels=ivLabels.map(function(l){return l.trim();}).filter(Boolean);
      props.onSave({name:n,hex:color.hex,text:color.text,icon:icon,ivLabels:labels});
    }
    var inp={background:"#1e293b",border:"1px solid #334155",borderRadius:8,padding:"8px 10px",color:"#e2e8f0",fontSize:13,width:"100%",boxSizing:"border-box"};
    var lbl={fontSize:11,color:"#64748b",fontFamily:"monospace",display:"block",marginBottom:4};
    return e('div',{style:{position:"fixed",inset:0,background:"#0009",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
      e('div',{style:{background:"#0f172a",borderRadius:16,padding:24,width:"100%",maxWidth:440,border:"2px solid "+color.hex+"60"}},
        e('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
          e('div',{style:{fontSize:15,fontWeight:700,color:color.hex,fontFamily:"monospace"}},icon+" New Section"),
          e('button',{onClick:props.onClose,style:{background:"none",border:"none",color:"#64748b",fontSize:22,lineHeight:1,cursor:"pointer"}},"✕")
        ),
        e('div',{style:{marginBottom:12}},
          e('label',{style:lbl},"Section Name"),
          e('input',{value:name,onChange:function(ev){setName(ev.target.value);setError("");},placeholder:"e.g. School, Hospital, Gym...",style:inp})
        ),
        e('div',{style:{marginBottom:12}},
          e('label',{style:lbl},"Icon"),
          e('div',{style:{display:"flex",gap:6,flexWrap:"wrap"}},
            PRESET_ICONS.map(function(ic){
              return e('button',{key:ic,onClick:function(){setIcon(ic);},
                style:{background:icon===ic?"#334155":"transparent",border:"1px solid "+(icon===ic?"#64748b":"#1e293b"),borderRadius:6,padding:"4px 8px",fontSize:18,cursor:"pointer"}},ic);
            })
          )
        ),
        e('div',{style:{marginBottom:16}},
          e('label',{style:lbl},"Colour"),
          e('div',{style:{display:"flex",gap:6,flexWrap:"wrap"}},
            PRESET_COLORS.map(function(c,i){
              return e('div',{key:i,onClick:function(){setColor(c);},
                style:{width:28,height:28,borderRadius:6,background:c.hex,cursor:"pointer",border:"2px solid "+(color.hex===c.hex?"#fff":"transparent")}});
            })
          )
        ),
        e('div',{style:{marginBottom:14}},
          e('label',{style:lbl},"Independent Variable Labels (optional)"),
          e('div',{style:{fontSize:11,color:"#475569",fontFamily:"monospace",marginBottom:6}},"Add up to 4 labels for your IV fields (e.g. Distance, Wind, Position...)"),
          e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}},
            [0,1,2,3].map(function(i){
              return e('input',{key:i,value:ivLabels[i],
                onChange:function(ev){setIvLabel(i,ev.target.value);},
                placeholder:"IV "+(i+1)+" label…",
                style:Object.assign({},inp,{fontSize:12})});
            })
          )
        ),
        e('div',{style:{background:color.hex,borderRadius:8,padding:"8px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:8}},
          e('span',{style:{fontSize:18}},icon),
          e('span',{style:{fontWeight:700,fontSize:14,color:color.text,fontFamily:"monospace"}},name||"Preview")
        ),
        error?e('div',{style:{fontSize:12,color:"#ef4444",marginBottom:10,fontFamily:"monospace"}},error):null,
        e('div',{style:{display:"flex",gap:10,justifyContent:"flex-end"}},
          e('button',{onClick:props.onClose,style:{background:"#334155",border:"none",borderRadius:8,padding:"9px 18px",color:"#94a3b8",fontSize:13,cursor:"pointer"}},"Cancel"),
          e('button',{onClick:save,style:{background:color.hex,border:"none",borderRadius:8,padding:"9px 18px",color:color.text,fontSize:13,fontWeight:700,cursor:"pointer"}},"Create Section")
        )
      )
    );
  }

  // ── Root: switches between Login and Dashboard ─────────────────────────────
  function Root(){
    var uv=useState(function(){
      try{
        var s=localStorage.getItem('ab_unlocked')||'';
        if(!s)return null;
        if(s.charAt(0)==='{')return JSON.parse(s);
        return {role:s,displayName:s==='admin'?'Sasha':''};
      }catch(e){return null;}
    }),auth=uv[0],setAuth=uv[1];
    function unlock(role,displayName,pin){
      var data={role:role,displayName:displayName||'',pin:pin||''};
      try{localStorage.setItem('ab_unlocked',JSON.stringify(data));}catch(e){}
      setAuth(data);
    }
    function logout(){try{localStorage.removeItem('ab_unlocked');}catch(e){}setAuth(null);}
    if(!auth)return e(Login,{onUnlock:unlock});
    var role=auth.role||'viewer';
    var displayName=auth.displayName||'';
    return e(Dashboard,{viewOnly:role!=='admin'&&role!=='researcher',role:role,displayName:displayName,pin:auth.pin||'',userKey:role,onLogout:logout});
  }

  RD.createRoot(document.getElementById("root")).render(e(Root,null));
  } catch(globalErr) {
    console.error("App failed to start:", globalErr);
    document.getElementById('root').innerHTML = '<div style="color:#ef4444;padding:40px;font-family:monospace;font-size:13px;line-height:1.6;"><b>App failed to start.</b><br><br>Error: '+globalErr.message+'<br><br>Try: right-click the HTML file → Open with → Brave or Chrome.</div>';
  }
});
</script>
